version = 1
ir = "fmi"
name = "fmi3"
description = "FMI 3.0.2 source-code ME+CS FMU with native tensor variables"
execution_mode = "packaged"
deployment_class = "fmu"
readiness_level = 1
completion_message = """FMI 3 ME+CS source FMU written to: {{ out_dir }}
  {{ model_name }}/     unpacked source FMU
  {{ model_name }}.fmu  standards-valid flat FMU archive
Advertised profiles: FMI 3 Model Exchange and Co-Simulation."""

[package]
root = "{{ model_name }}"
required_files = ["modelDescription.xml", "sources/buildDescription.xml", "sources/model.c", "sources/model.h", "sources/rmc_rows.c", "sources/rmc_isolators.c", "sources/rmc_functions.c", "sources/rmc_assign.c", "sources/rmc_jacobian.c"]

[package.archive]
path = "{{ model_name }}.fmu"
format = "zip"
root = "flat"

[capabilities]
continuous_states = true
residual_equations = false
exact_algebraic_assignments = true
algebraic_projection = true
scalar_fallback = true
external_functions = true
external_tables = false
random = true
initialization = false
parameter_initialization = true
events = false
static_assertions = true
runtime_events = false
clocks = false
sample_events = true
dynamic_ranges = false
dynamic_derivative_subscripts = false
forward_ad = false
reverse_ad = false
dynamic_control_flow = false
host_callbacks = false

[capabilities.tensor]
matmul = "scalar"
linsolve = "scalar"
elementwise = "scalar"
stencil = "scalar"
reductions = "scalar"
layout = "row-major"
supports_dynamic_shapes = false
sparse = false
dtypes = ["f64"]

[[files]]
path = "modelDescription.xml"
template = "modelDescription.xml.jinja"
id = "fmu"

[[files]]
path = "sources/buildDescription.xml"
template = "buildDescription.xml.jinja"

[[files]]
path = "sources/model.c"
template = "model.c.jinja"
shared_as = "fmi3-model.c.jinja"

[[files]]
path = "sources/model.h"
template = "model.h.jinja"
shared_as = "fmi3-model.h.jinja"

[[files]]
path = "sources/rmc_rows.c"
template = "rmc_rows.c.jinja"
shared_as = "fmi3-rmc_rows.c.jinja"

[[files]]
path = "sources/rmc_isolators.c"
template = "rmc_isolators.c.jinja"
shared_as = "fmi3-rmc_isolators.c.jinja"

[[files]]
path = "sources/rmc_functions.c"
template = "rmc_functions.c.jinja"
shared_as = "fmi3-rmc_functions.c.jinja"

[[files]]
path = "sources/rmc_assign.c"
template = "rmc_assign.c.jinja"
shared_as = "fmi3-rmc_assign.c.jinja"

[[files]]
path = "sources/rmc_jacobian.c"
template = "rmc_jacobian.c.jinja"
shared_as = "fmi3-rmc_jacobian.c.jinja"

# The MSL ModelicaExternalC sources a cataloged external C function needs
# (MLS §12.9). A path that renders empty is not part of the product, so these
# ship only with a model that calls one.

[[files]]
path = "{% if fmi_external_c is defined and fmi_external_c.modelica_random %}sources/ModelicaRandom.c{% endif %}"
template = "msl_ModelicaRandom.c.jinja"
shared_as = "fmi-msl-ModelicaRandom.c"

[[files]]
path = "{% if fmi_external_c is defined and fmi_external_c.modelica_random %}sources/ModelicaRandom.h{% endif %}"
template = "msl_ModelicaRandom.h.jinja"
shared_as = "fmi-msl-ModelicaRandom.h"

[[files]]
path = "{% if fmi_external_c is defined and fmi_external_c.modelica_random %}sources/ModelicaInternal.h{% endif %}"
template = "msl_ModelicaInternal.h.jinja"
shared_as = "fmi-msl-ModelicaInternal.h"

[[files]]
path = "{% if fmi_external_c is defined and fmi_external_c.modelica_random %}sources/ModelicaUtilities.h{% endif %}"
template = "msl_ModelicaUtilities.h.jinja"
shared_as = "fmi-msl-ModelicaUtilities.h"

[[files]]
path = "{% if fmi_external_c is defined and fmi_external_c.modelica_random %}sources/gconstructor.h{% endif %}"
template = "msl_gconstructor.h.jinja"
shared_as = "fmi-msl-gconstructor.h"

[[files]]
path = "{% if fmi_external_c is defined and fmi_external_c.modelica_random %}sources/rmc_modelica_external.c{% endif %}"
template = "rmc_modelica_external.c.jinja"
shared_as = "fmi-rmc_modelica_external.c"

[[files]]
path = "{% if fmi_external_c is defined and fmi_external_c.modelica_random %}documentation/licenses/ModelicaExternalC.txt{% endif %}"
template = "msl_licenses.txt.jinja"
shared_as = "fmi-msl-licenses.txt"

[[partials]]
template = "scalar_kernel.jinja"
name = "fmi-c-kernel.jinja"

[[partials]]
template = "me_projection.jinja"
name = "fmi-me-projection.jinja"

[[partials]]
template = "typed_functions.jinja"
name = "fmi-typed-functions.jinja"

[[partials]]
template = "typed_arithmetic.jinja"
name = "fmi-typed-arithmetic.jinja"

[[partials]]
template = "typed_tensors.jinja"
name = "fmi-typed-tensors.jinja"

[[partials]]
template = "scalar_events.jinja"
name = "fmi-scalar-events.jinja"
